<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if inventario %}Editar{% else %}Crear{% endif %} producto</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
 
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                {% if inventario %}Editar{% else %}Nuevo{% endif %} producto de inventario
            </h3>
        </div>
 
        <div class="card-body">
            <form method="post"
                  action="{% if inventario %}/inventario/{{ inventario.id }}/edit{% else %}/inventario/new{% endif %}">
 
                <!-- Nombre -->
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           name="nombre"
                           class="form-control"
                           value="{{ inventario.nombre if inventario else '' }}"
                           required>
                </div>
 
                <!-- Tipo -->
                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <input type="text"
                           name="tipo"
                           class="form-control"
                           value="{{ inventario.tipo if inventario else '' }}"
                           required>
                </div>
 
                <!-- Cantidad -->
                <div class="mb-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number"
                           name="cantidad"
                           class="form-control"
                           min="0"
                           value="{{ inventario.cantidad if inventario else 0 }}"
                           required>
                </div>
 
                <!-- Precio -->
                <div class="mb-3">
                    <label class="form-label">Precio (€)</label>
                    <input type="number"
                           step="0.01"
                           name="precio"
                           class="form-control"
                           value="{{ inventario.precio if inventario else '' }}">
                </div>
 
                <!-- Fecha caducidad -->
                <div class="mb-3">
                    <label class="form-label">Fecha de caducidad</label>
                    <input type="date"
                           name="fecha_caducidad"
                           class="form-control"
                           value="{% if inventario %}{{ inventario.fecha_caducidad.strftime('%Y-%m-%d') }}{% endif %}"
                           required>
                </div>
 
                <!-- Activo -->
                <div class="form-check mb-4">
                    <input class="form-check-input"
                           type="checkbox"
                           name="activo"
                           {% if inventario and inventario.activo %}checked{% endif %}>
                    <label class="form-check-label">
                        Producto activo
                    </label>
                </div>
 
                <!-- Botones -->
                <div class="d-flex justify-content-between">
                    <a href="/inventario" class="btn btn-secondary">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        {% if inventario %}Actualizar{% else %}Crear{% endif %}
                    </button>
                </div>
 
            </form>
        </div>
    </div>
</div>
</body>
</html>
